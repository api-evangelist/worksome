note: >-
  Worksome publishes an MCP Server page and names "MCP" as an included platform capability on its
  pricing page, but ships no reachable MCP server today. The docs state plainly that it "is in
  early access and not yet generally available", that the endpoint is disclosed only after
  onboarding, and that the tool reference is deliberately not published because "which operations
  to expose to an agent is a deliberate decision rather than a straight mirror of the API". No
  endpoint URL, no npm or PyPI package, and no install command appear anywhere on the developer
  surface. No endpoint was guessed or probed into existence: a candidate MCP path that happens to
  answer 200 would read as a verified agent surface, which is exactly the error this record must
  not make. Wired into apis.yml as X-MCPServerCandidate, NOT as MCPServer — the provider does not
  yet serve one.

