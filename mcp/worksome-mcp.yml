assessment: >-
  Worksome has done the documentation half of agent readiness properly — a published llms.txt, a
  full docs corpus, an explicitly agent-targeted CLI with a rehearsal flag, and an openly
  introspectable schema. What it does not yet have is a callable agent endpoint. An agent can
  learn this API today and, with a granted CLI, act on it; it cannot connect to it over MCP.
