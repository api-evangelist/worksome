note: >-
  Worksome keeps a hand-curated, dated API changelog on the docs host, organised by impact
  band (Medium Impact Changes / Low Impact Changes / Documentation). It is a summary layer:
  the page points at Apollo Studio for the exhaustive machine-generated schema changelog,
  which is where every field-level change lands. Entries carry before/after query examples for
  deprecations, which is materially more useful than a bare "deprecated X" line. There is no
  RSS or JSON feed for the changelog, and no version number — the API is unversioned and
  evolves in place, so the changelog IS the versioning surface.
