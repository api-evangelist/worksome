- aid: worksome:webhooks
  name: Worksome Webhooks
  description: 'Worksome outbound webhooks deliver real-time notifications for 17 event
    types across hires and contracts, the talent pool, payment requests and invoicing.
    Each delivery is an HTTP POST with a JSON body signed with HMAC-SHA256 in a Signature
    header using a shared secret. Payloads are deliberately minimal and carry Global IDs
    that resolve against the GraphQL API. Failed deliveries are retried up to five times
    with exponential backoff (10s, 100s, 1000s, 10000s).'
  humanURL: https://docs.worksome.com/webhooks/
  image: https://cdn.prod.website-files.com/60a21be3147bde7a6ece004d/60e44e338953920e5aafcd66_Worksome%20Webclip.png
