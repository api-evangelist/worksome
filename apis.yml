aid: worksome
name: Worksome
description: 'Worksome is a Copenhagen-headquartered external workforce platform (Freelancer
  Management System) used by enterprise and mid-market teams to source, contract, classify,
  and pay contingent workers across 150+ countries. It ships a public GraphQL API at
  api.worksome.com/graphql covering hires, contracts, jobs, candidates, projects, timesheets,
  payment requests, invoices, compliance gates and worker classification, alongside 17
  HMAC-signed webhook events, an official PHP SDK, a Go CLI with 170+ operations, a Zapier
  app, and an early-access MCP server for AI agents.'
url: https://raw.githubusercontent.com/api-evangelist/worksome/refs/heads/main/apis.yml
