apis:
- aid: worksome:graphql
  name: Worksome GraphQL API
  description: 'The Worksome public GraphQL API — a single POST endpoint at
    https://api.worksome.com/graphql exposing 87 queries and 113 mutations across 496
    types. Covers hires and contracts, jobs and candidates, projects and milestones,
    timesheets and payment requests, invoices, trusted contacts (talent pool), compliance
    gates and worker classification, approvals and workflows, custom fields, user groups,
    and webhook management. Authenticated with a Bearer Personal Access Token or an OAuth
    2.0 authorization-code token. Schema introspection is open and unauthenticated.'
  humanURL: https://docs.worksome.com/graphql/
  image: https://cdn.prod.website-files.com/60a21be3147bde7a6ece004d/60e44e338953920e5aafcd66_Worksome%20Webclip.png
