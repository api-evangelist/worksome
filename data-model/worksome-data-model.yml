source: graphql/worksome-introspection.json (unauthenticated introspection of https://api.worksome.com/graphql)
note: 'Entity-relationship graph derived from the introspected GraphQL schema, not from an OpenAPI $ref graph —
  Worksome publishes no OpenAPI. Relationships are read from field return types: a field returning an object type
  is has_one, a field returning a list or a *Paginator wrapper is has_many. Only the 36 core business entities are
  modelled here; the full schema carries 170 object types, most of which are settings, detail, and result wrappers
  hanging off these. Identifiers are Relay-style opaque global IDs (base64 of "Type:id"), and the same ids appear
  in webhook payloads, which is what lets a minimal webhook payload be resolved against this graph.'
identifier_scheme:
  style: Relay global object identification
  encoding: base64("{TypeName}:{numeric id}")
  examples:
    Hire:1: SGlyZTox
    Contract:1234: Q29udHJhY3Q6MTIzNA==
    Company:1: Q29tcGFueTox
  opaque: true
  note: Treat as opaque handles obtained from the API. Decoding is possible but not a documented contract.
central_entity:
  name: Hire
  rationale: 'Hire is the hub. Worksome''s own llms.txt calls it "the engagement of a worker by a company. Central
    entity connecting most operations." It carries 75 fields and links out to Contract (three ways: latestContract,
    activeContract, draftContract), Company, Job, Worker, Recruiter, supplier Account, Classification, Employment,
    Compliance and Conversation. Timesheets, payment requests and milestones all hang off it. hireId is the stable
    engagement reference across contract revisions.'
lifecycle_backbone:
  chain: Job -> JobCandidate -> Bid -> Hire -> Contract -> Timesheet -> PaymentRequest -> Invoice
  note: The money path. A job posting attracts candidates; an accepted bid becomes a hire; the hire carries contracts;
    time registered against the hire becomes timesheets; timesheets become payment requests; payment requests roll
    into invoices, which can be offset by credit notes (modelled as Invoice records linked via originalInvoice/creditNotes).
account_polymorphism:
  interface: Account
  implementations:
  - Company
  - Organisation
  - Partner
  - Recruiter
  - Worker
  implementations_source: introspection of __type(name "Account").possibleTypes
  docs_discrepancy: >-
    The Getting Started page states the Account interface is implemented by "Company, Organisation,
    Partner, StaffingAgency, and Worker". Introspection returns Company, Organisation, Partner,
    Recruiter, Worker — there is no StaffingAgency type anywhere in the 496-type schema. A client
    that follows the docs and writes "... on StaffingAgency" fails schema validation with
    GRAPHQL_VALIDATION_FAILED. The schema is the contract; the docs appear to use a display name.
    Recorded because it is a real, reproducible defect in Worksome's published documentation.
  note: The top-level accounts query returns the Account interface. Most company-context operations require a Company
    id specifically, so callers must fragment (... on Company) and pass the right kind of id for the operation.
