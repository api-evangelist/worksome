method: searched
source: https://docs.worksome.com/changelog/ + https://status.worksome.com/ + graphql/worksome-introspection.json
note: >-
  Worksome has no written versioning or deprecation POLICY document — there is no page stating
  a support window, a notice period, or an SLA. What it has instead is a consistently applied
  deprecation PRACTICE that is visible in two places at once: every deprecated schema element
  carries an @deprecated reason naming its replacement, and the dated changelog restates the
  same deprecation in prose with before/after queries. On at least one occasion (Bill to
  PaymentRequest, 2024-02-12) the removal date was announced six months in advance and
  honoured. That is stronger evidence than most published policies, but it is practice, not
  commitment: no document obliges Worksome to give notice on the next one.

versioning:
  scheme: unversioned
  in_url: false
  in_header: false
  note: >-
    The endpoint is https://api.worksome.com/graphql and is constant. There is no version path
    segment, no version header, and no version field in the schema. The API evolves in place
    using GraphQL's additive model, and the dated changelog is the only record of what changed.
  breaking_change_handling: >-
    Breaking changes happen via a deprecate-then-remove cycle rather than a version bump. Two
    removals appear in the published window (Job.paymentScheme, removed 2024-09-29; the bill /
    bills surface, removed 2024-08-29), each preceded by a deprecation entry.

