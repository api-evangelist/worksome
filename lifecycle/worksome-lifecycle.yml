support:
  developer_support: https://docs.worksome.com/support/
  help_center: https://help.worksome.dk/en
  channel: email to the address published on the docs support page, plus the customer's Worksome account representative
  note: >-
    There is no public developer community, forum, or issue tracker. The CLI and MCP server
    both route support through "your Worksome contact", and the CLI repository is private, so
    there is no public place to report an API defect.
